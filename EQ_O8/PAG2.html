    <div></div>

    <DIV></DIV>

        <DIV class="center">

        <input class="CE" type="radio" value="escuela" id="radio1" name="valores"><br>
    </label>
    <label for="radio2">USO PERSONAL
        <input class="CE" type="radio"  value="personal" id="radio2" name="valores">
    </label>
    <label for="radio3">AMBAS
        <input class="CE" type="radio"  value="personal" id="radio3" name="valores">
    </label>
<div></div>
</DIV>

<div></div>

</label>
<div></div>

</label>
<div></div>
</label>
<div></div>

</label>
<div></div>

    <input class="min" type="number" placeholder="edad" min="0" max="102" required id="num">
</label>
    <div></div>
    <label for="range">Que le parece nuestro formulario
        <input type="range" id="range" name="rango" min="0" max="10" id="range">
    </label>
    <div></div>
    <label for="resetear">DESEA REINCIAR  EL FORMULARIO<br>
        <input class="resetear" type="reset">
    </label>
    <div></div>
    <label for="dato1">ACEPTA LOS TERMINOS Y CONDICIONES DE LA PAGINA WEB

</label>
